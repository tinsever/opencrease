<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Snapshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h8l4 4v8H2z" fill="var(--of-ink)" /><path d="M10 2v4h4z" fill="var(--of-accent)" /></svg>
        <div class="title">Snapshot</div>
        <div class="conn" id="conn" data-state="checking"><span class="dot"></span><span id="conn-text">Looking for OpenCrease</span></div>
      </header>

      <div class="modes" role="group" aria-label="Capture">
        <button class="mode" id="mode-element" type="button">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5l10 4.6-4.3 1.2-2 4.2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg>
          <span class="label">Pick an element</span>
          <span class="meta" id="picking-meta"></span>
        </button>
        <button class="mode" id="mode-viewport" type="button">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3" /></svg>
          <span class="label">Visible area</span>
        </button>
        <button class="mode" id="mode-page" type="button">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="1.5" width="9" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M6 5h4M6 8h4M6 11h2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
          <span class="label">Full page</span>
          <span class="meta" id="page-shortcut">⌘↵</span>
        </button>
      </div>

      <section class="dest">
        <label class="section-title" for="destination">Send to</label>
        <div class="select">
          <select id="destination"></select>
          <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
        <label class="check"><input type="checkbox" id="keep-fonts" /><span class="box"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.5l2.2 2.2L9.5 3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span>Keep fonts and OpenType features</span></label>
        <label class="check" id="tokens-row"><input type="checkbox" id="color-tokens" /><span class="box"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.5l2.2 2.2L9.5 3.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg></span><span>Turn colors into tokens</span></label>
      </section>

      <section class="dest"><label class="section-title" for="session-token">Session token</label><input id="session-token" type="password" autocomplete="off" spellcheck="false" placeholder="From OpenCrease, Connect an agent" class="token-input" /></section>

      <footer class="foot" id="foot">
        <div class="hint" id="hint">Pick a section, or capture the visible area or the whole page.</div>
        <button class="port" id="port-button" type="button" title="Port of the local OpenCrease server">Port <span id="port-value">29880</span></button>
        <input class="port-input" id="port-input" type="number" min="1" max="65535" hidden aria-label="OpenCrease server port" />
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
